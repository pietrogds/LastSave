<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LastSave | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="icon" href="./images/lastsave.ico" />
</head>

<body>
  <!--header inicio-->
  <div class="header">
    <div class="container">
      <a href="index.html">
        <img class="logo" src="images/lastsave-logo-v4-transparente.svg" alt="LastSave">
      </a>

      <ul class="navbar">
        <li><a href="index.html">Início</a></li>
        <li class="bloqueado"><a href="login.html" title="Faça login para acessar">&#128274; História</a></li>
        <li class="bloqueado"><a href="login.html" title="Faça login para acessar">&#128274; Jogos</a></li>
        <li class="bloqueado"><a href="login.html" title="Faça login para acessar">&#128274; Minha História</a></li>
        <li class="bloqueado"><a href="login.html" title="Faça login para acessar">&#128274; Quiz</a></li>
      </ul>

      <div>
        <a class="botao botao-azul" href="login.html">Login</a>
        <a class="botao botao-laranja" href="cadastro.html">Cadastro</a>
      </div>
    </div>
  </div>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>Sobrenome:</span>
            <input id="sobrenome_input" type="text" placeholder="Seu sobrenome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao botao-laranja" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./images/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>

        <p class="link-troca">Já tem conta? <a href="login.html">Fazer login</a></p>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <p>LastSave &copy; 2026 &bull; Projeto Individual SPTech</p>
    </div>
  </div>
  <!--footer fim-->
</body>

</html>

<script>

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    let nomeVar = nome_input.value;
    let sobrenomeVar = sobrenome_input.value;
    let emailVar = email_input.value;
    let senhaVar = senha_input.value;
    let confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      sobrenomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha todos os campos!";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        sobrenomeServer: sobrenomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function limparFormulario() {
    nome_input.value = "";
    sobrenome_input.value = "";
    email_input.value = "";
    senha_input.value = "";
    confirmacao_senha_input.value = "";
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
